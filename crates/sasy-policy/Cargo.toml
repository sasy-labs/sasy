[package]
name = "sasy-policy"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Policy engine: Soufflé evaluator orchestration over IPC, policy registry, and per-session evaluators"

[lib]
name = "sasy_policy"

[[bin]]
name = "policy-analyze"
path = "src/bin/policy_analyze.rs"

[dependencies]
libc = { workspace = true }
sasy-common = { workspace = true }
sasy-redaction = { workspace = true }
sasy-graph = { workspace = true }
sasy-auth = { workspace = true }
sasy-policy-analysis = { workspace = true }
tonic = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
parking_lot = { workspace = true }
tracing-subscriber = { workspace = true }
fnv = { workspace = true }
regex = { workspace = true }
async-channel = "2"
sha2 = "0.10"
uuid = { workspace = true }

# LLM support (optional)
async-openai = { version = "0.32", optional = true, features = ["chat-completion"] }
redis = { version = "0.27", features = ["aio", "tokio-comp"], optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = ["compiler"]
# Souffle/g++/sugar.py compile pipeline. Built into the full engine; the
# restricted build turns it OFF (no runtime toolchain) and keeps only the baked
# evaluators + bind-by-hash. See lib.rs (mod compiler) and replay.rs (the
# not(compiler) stub for compile_factory_from_source).
compiler = []
llm = ["async-openai", "redis"]
