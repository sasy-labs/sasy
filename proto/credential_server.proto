syntax = "proto3";

// Per-entity credential store. Credential-injection transforms read from it:
// when a policy authorizes an action and emits ApplyTransform, the reference
// monitor looks up the named credential here and fills it into the outgoing
// request. The tenant is always derived from the authenticated caller.
service CredentialServer {
    // Read the credentials stored for one entity and service.
    rpc GetCredentials (CredentialsRequest) returns (Credentials);
    // Store credentials for one entity and service. Every key in the request
    // is written, overwriting any value already stored under that key. Keys
    // that the request does not mention keep the value they have; this call
    // never deletes a stored credential.
    rpc SetCredentials (SetCredentialsRequest) returns (CredentialResponse);
}

// Store credentials for one entity under one service name.
message SetCredentialsRequest {
  // Tag 4 is reserved. The tenant is always derived from the
  // authenticated caller, never from the request.
  reserved 4;
  reserved "tenant_id";

  optional string entity = 1;
  optional string service = 2;
  repeated Credential credentials = 3;
}

// Ask for the credentials of one entity under one service name.
message CredentialsRequest {
  // Tag 3 is reserved; see SetCredentialsRequest.
  reserved 3;
  reserved "tenant_id";

  optional string entity = 1;
  optional string service = 2;
}

// One stored secret: `key` is the name a transform refers to, `value` is the
// secret itself.
message Credential {
  optional string key = 1;
  optional string value = 2;
}

// The credentials stored for the requested entity and service; empty when
// nothing is stored.
message Credentials {
  repeated Credential credentials = 1;
}

// Result of a write. `response` carries a short status message.
message CredentialResponse {
    optional string response = 1;
}
