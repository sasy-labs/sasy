<svg xmlns="http://www.w3.org/2000/svg" class="flow-graph" width="1240" height="1050" viewBox="0 0 1240 1050" role="img" aria-labelledby="title desc">
<title id="title">Arrival order changes the send’s ancestors</title>
<desc id="desc">Two illustrative variants, not a captured execution trace. A coordinator spawns two summarizers to review a sensitive report and an untrusted note. Left: the note has not reached the coordinator, so the send depends only on sensitive data and is allowed. Right: the note arrives before the send, which is redirected and denied because both labels reach it. Circles are LLM calls; rectangles are actions; pills are inputs and results. Dashed outlines mark action ancestors.</desc>
<style>
.flow-graph { --ink:#243449; --muted:#59687b; --paper:#fff; --line:#c7d0dc; --edge:#a3adba; --u:#315bb5; --ubg:#edf2ff; --s:#975b06; --sbg:#fff4da; --mix:#f4eef8; --trace:#7854b1; --tracebg:#f4f0fa; --allow:#17613c; --deny:#b02b35; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
[data-theme='dark'] .flow-graph { --ink:#e7edf5; --muted:#adb9c9; --paper:#151b25; --line:#596576; --edge:#637084; --u:#9dbfff; --ubg:#1c3053; --s:#f7ca7e; --sbg:#3b3020; --mix:#302d46; --trace:#c5abf0; --tracebg:#29243b; --allow:#8de0b1; --deny:#ffa5a8; }
.flow-graph .edge { fill:none; stroke:#a3adba; stroke-width:1.5; }
.flow-graph .edge.traced { stroke:#7854b1; stroke-width:2.4; }
.flow-graph .node-shape { fill:#fff; stroke:#c7d0dc; stroke-width:1.8; }
.flow-graph .untrusted .node-shape { fill:#edf2ff; stroke:#315bb5; stroke-width:2.5; }
.flow-graph .sensitive .node-shape { fill:#fff4da; stroke:#975b06; stroke-width:2.5; }
.flow-graph .mixed .node-shape { fill:#f4eef8; stroke:#315bb5; stroke-width:2.5; }
.flow-graph .second-border { fill:none; stroke:#975b06; stroke-width:2; }
.flow-graph .slice-halo { fill:none; stroke:#7854b1; stroke-width:1.5; stroke-dasharray:4 4; }
.flow-graph .neutral.in-slice .node-shape { fill:#f4f0fa; }
.flow-graph .target .slice-halo { stroke-width:2.5; stroke-dasharray:5 3; }
.flow-graph .outside:not(.in-slice) .node-shape { stroke-opacity:.5; }
.flow-graph .node-label { font-size:15px; font-weight:620; fill:#243449; text-anchor:middle; }
.flow-graph .node-detail { font-size:12px; fill:#59687b; text-anchor:middle; }
.flow-graph .llm-detail { font-size:11px; fill:#59687b; text-anchor:middle; }
.flow-graph .node-detail.allow { fill:#17613c; font-weight:700; }
.flow-graph .node-detail.deny { fill:#b02b35; font-weight:700; }
.flow-graph .badge circle { fill:#fff; stroke-width:1.8; }
.flow-graph .badge.untrusted circle { stroke:#315bb5; }
.flow-graph .badge.sensitive circle { stroke:#975b06; }
.flow-graph .badge.source.untrusted circle { fill:#edf2ff; }
.flow-graph .badge.source.sensitive circle { fill:#fff4da; }
.flow-graph .badge text { font-size:12px; font-weight:700; text-anchor:middle; fill:#243449; }
.flow-graph .handoff { font-size:12px; fill:#59687b; }
.flow-graph [data-inspect] { cursor:pointer; }
.flow-graph [data-inspect]:focus-visible { outline:none; }
.flow-graph [data-inspect]:focus-visible .node-shape { stroke:#7854b1; stroke-width:4; }
@media (prefers-reduced-motion:no-preference) { .flow-graph .target { animation:graph-arrive .3s ease-out; } @keyframes graph-arrive { from { opacity:.4; } to { opacity:1; } } }
</style><rect width="1240" height="1050" rx="12" fill="#fff"/>
