name: Engine release rehearsal

on:
  workflow_dispatch:

# Rehearsals create private test images and a draft release only. They do not
# publish stable tags, Docker Hub images, SDK packages or a public release.
permissions: {}

concurrency:
  group: engine-rehearsal-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'nilspalumbo/sasy-test' && github.event.repository.private
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            machine: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    env:
      ARCH: ${{ matrix.arch }}
      MACHINE: ${{ matrix.machine }}
      IMAGE: ghcr.io/nilspalumbo/sasy-test
      REHEARSAL: rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
      DOCKER_LABEL: sasy-rehearsal=${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require native architecture
        run: test "$(uname -m)" = "$MACHINE"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Install qualification tools
        run: uv sync --group dev
      - name: Build release engine and image from the locked flake
        run: |
          docker build --target builder --tag sasy-rehearsal-builder .
          docker build --tag "$IMAGE:$REHEARSAL-$ARCH" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .
      - name: Export and import the complete native runtime closure
        run: |
          mkdir -p dist
          engine=$(docker run --rm --entrypoint /bin/sh sasy-rehearsal-builder -c 'readlink /rootfs/bin/sasy')
          case "$engine" in /nix/store/*-sasy-*/bin/sasy) ;; *) echo 'Unexpected engine path'; exit 1;; esac
          printf '%s\n' "$engine" > "dist/sasy-linux-$ARCH.path"
          manifest=$(docker run --rm --entrypoint nix sasy-rehearsal-builder \
            --extra-experimental-features 'nix-command flakes' eval --raw --no-update-lock-file \
            "path:/build#packages.$MACHINE-linux.sasy.runtimeManifest.outPath")
          printf '%s\n' "$manifest" > "dist/sasy-linux-$ARCH.runtime-manifest.path"
          docker run --rm --entrypoint /bin/sh sasy-rehearsal-builder \
            -c 'xargs nix-store --export < /store-paths' | xz -T2 > "dist/sasy-linux-$ARCH.nar.xz"
          # Root import may reuse existing paths with different metadata.
          xz -dc "dist/sasy-linux-$ARCH.nar.xz" | \
            sudo env NIX_REMOTE=local /nix/var/nix/profiles/default/bin/nix-store --import > "$RUNNER_TEMP/imported-paths"
          sudo python3 scripts/prepare_rehearsal_store.py "$RUNNER_TEMP/imported-paths" \
            --nix-store /nix/var/nix/profiles/default/bin/nix-store
          test -x "$engine"
          printf 'ENGINE=%s\n' "$engine" >> "$GITHUB_ENV"
      - name: Admit only the packaged Bubblewrap to Ubuntu user namespaces
        run: |
          manifest=$(cat "dist/sasy-linux-$ARCH.runtime-manifest.path")
          test "$(stat -c %u "$manifest")" = 0
          bwrap=$(python3 - "$manifest" <<'PY'
          import json, re, sys
          from pathlib import Path
          tool = Path(json.loads(Path(sys.argv[1]).read_text())["tools"]["bwrap"]).resolve(strict=True)
          assert re.fullmatch(r"/nix/store/[a-z0-9]{32}-[A-Za-z0-9+._?=-]+/bin/[A-Za-z0-9._-]+", str(tool)), tool
          assert tool.stat().st_uid == 0 and tool.stat().st_mode & 0o222 == 0, tool
          print(tool)
          PY
          )
          # Ubuntu's per-executable userns permission keeps the system-wide
          # restriction enabled and SASY's Bubblewrap sandbox intact.
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile sasy-rehearsal-bwrap %s flags=(unconfined) { userns, }\n' "$bwrap" | \
            sudo tee /etc/apparmor.d/sasy-rehearsal-bwrap
          sudo apparmor_parser --replace /etc/apparmor.d/sasy-rehearsal-bwrap
          "$bwrap" --unshare-all --die-with-parent --ro-bind / / --proc /proc --dev /dev /bin/true
      - name: Qualify the imported native bundle
        env:
          PYTHON_DOTENV_DISABLED: '1'
        run: |
          SASY_TEST_ENGINE="$ENGINE" uv run --no-sync pytest --run-integration -q \
            --basetemp "$RUNNER_TEMP/sasy-native-tests" \
            tests/integration/test_core_rpc.py::test_action_order_timing_and_transform_ids \
            tests/integration/test_policy_lifecycle.py::test_distinct_policy_bindings_and_rebind_preserve_graph \
            tests/integration/test_policy_lifecycle.py::test_dependency_context_controls_authorization
      - name: Qualify the final image
        env:
          PYTHON_DOTENV_DISABLED: '1'
        run: |
          python3 scripts/release_image_wrapper.py "$RUNNER_TEMP/sasy-image-engine" \
            --image "$IMAGE:$REHEARSAL-$ARCH" --label "$DOCKER_LABEL"
          SASY_TEST_ENGINE="$RUNNER_TEMP/sasy-image-engine" uv run --no-sync pytest --run-integration -q \
            --basetemp "$RUNNER_TEMP/sasy-image-tests" \
            tests/integration/test_core_rpc.py::test_action_order_timing_and_transform_ids \
            tests/integration/test_policy_lifecycle.py::test_distinct_policy_bindings_and_rebind_preserve_graph \
            tests/integration/test_policy_lifecycle.py::test_dependency_context_controls_authorization
      - name: Push qualified test image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/check_rehearsal_registry.py --allow-missing
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$REHEARSAL-$ARCH"
          python3 scripts/check_rehearsal_registry.py
          docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$REHEARSAL-$ARCH" > "dist/sasy-linux-$ARCH.image"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engine-linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Retain unqualified candidates for diagnosis
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unqualified-engine-linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: ignore
          retention-days: 1
      - name: Clean up owned test containers
        if: always()
        run: |
          docker ps -aq --filter "label=$DOCKER_LABEL" | xargs -r docker rm -f
          docker logout ghcr.io || true
          if test -f /etc/apparmor.d/sasy-rehearsal-bwrap; then
            sudo apparmor_parser --remove /etc/apparmor.d/sasy-rehearsal-bwrap
            sudo rm /etc/apparmor.d/sasy-rehearsal-bwrap
          fi

  draft:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE: ghcr.io/nilspalumbo/sasy-test
      REHEARSAL: rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: engine-linux-*
          path: dist
          merge-multiple: true
      - name: Publish multi-platform test manifest
        run: |
          python3 scripts/check_rehearsal_registry.py
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker manifest create "$IMAGE:$REHEARSAL" \
            "$(cat dist/sasy-linux-amd64.image)" "$(cat dist/sasy-linux-arm64.image)"
          docker manifest push "$IMAGE:$REHEARSAL"
          docker manifest inspect "$IMAGE:$REHEARSAL" > dist/image-manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('dist/image-manifest.json').read_text())
          assert {(m['platform']['os'], m['platform']['architecture']) for m in manifest['manifests']} == {('linux', 'amd64'), ('linux', 'arm64')}
          PY
      - name: Create draft release with checksummed bundles
        run: |
          cp docs/engine-rehearsal.md dist/INSTALL.md
          cp scripts/prepare_rehearsal_store.py dist/prepare_rehearsal_store.py
          (cd dist && sha256sum *.nar.xz *.path *.image image-manifest.json INSTALL.md prepare_rehearsal_store.py > SHA256SUMS)
          gh release create "$REHEARSAL" dist/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --draft --prerelease \
            --title "Engine release rehearsal $REHEARSAL" --notes-file docs/engine-rehearsal.md
      - name: Verify release downloads
        run: |
          mkdir "$RUNNER_TEMP/release-download"
          gh release download "$REHEARSAL" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release-download"
          (cd "$RUNNER_TEMP/release-download" && sha256sum -c SHA256SUMS)
      - name: Log out
        if: always()
        run: docker logout ghcr.io || true
