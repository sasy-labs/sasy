name: Python SDK release

# Dispatch validates artifacts. Public version tags coordinate engine and SDK publication.
on:
  push:
    branches: [main, 'release/**']
    tags: ['sasy-v*']
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  core:
    # Branch/PR pushes run ci-core separately; tag releases gate inside engine.
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci-core.yml
    permissions:
      contents: read

  engine:
    if: github.event_name == 'push' && github.repository == 'sasy-labs/sasy' && !github.event.repository.private && startsWith(github.ref, 'refs/tags/sasy-v')
    uses: ./.github/workflows/engine-release.yml
    permissions:
      contents: read
      packages: write

  build:
    if: ${{ !cancelled() && (needs.core.result == 'success' || needs.core.result == 'skipped') }}
    needs: core
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Check SDK identity and tag
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          project = tomllib.loads(pathlib.Path('sdk/python/pyproject.toml').read_text())['project']
          assert project['name'] == 'sasy'
          if os.environ['GITHUB_REF'].startswith('refs/tags/'):
              assert os.environ['GITHUB_REF_NAME'] == 'sasy-v' + project['version']
          PY
      - name: Build wheel and source distribution
        run: uv build --package sasy --out-dir artifacts
      - name: Check package metadata and independent installation
        run: |
          uvx --from twine twine check --strict artifacts/*
          uv venv "$RUNNER_TEMP/sdk-consumer"
          uv pip install --python "$RUNNER_TEMP/sdk-consumer/bin/python" artifacts/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sdk-consumer/bin/python" - <<'PY'
          import importlib.metadata, pathlib, sys, zipfile
          import sasy
          from sasy.auth import APIKeyAuthHook
          from sasy.proto import policy_engine_pb2
          assert pathlib.Path(sasy.__file__).is_relative_to(pathlib.Path(sys.prefix))
          for name in ('configure', 'session', 'check_tool_call'):
              assert callable(getattr(sasy, name)), name
          dist = importlib.metadata.distribution('sasy')
          files = [str(p) for p in dist.files]
          assert any(p.endswith('/LICENSE') for p in files)
          assert any(p.endswith('/NOTICE') for p in files)
          assert policy_engine_pb2.DESCRIPTOR.services_by_name
          assert callable(APIKeyAuthHook)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: sasy-python-package
          path: artifacts/*
          if-no-files-found: error

  publish:
    if: ${{ !cancelled() && github.event_name == 'push' && github.repository == 'sasy-labs/sasy' && !github.event.repository.private && startsWith(github.ref, 'refs/tags/sasy-v') && needs.engine.result == 'success' && needs.build.result == 'success' && needs.engine.outputs.digest != '' && github.ref_name == format('sasy-v{0}', needs.engine.outputs.version) }}
    needs: [engine, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sasy/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: sasy-python-package
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
