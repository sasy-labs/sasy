name: Python SDK release

# Dispatch validates artifacts. Public version tags coordinate engine and SDK publication.
on:
  push:
    branches: [main, 'release/**']
    tags: ['sasy-v*']
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:
    inputs:
      recovery_run:
        description: Existing qualified release run to recover without rebuilding (blank validates a new build)
        type: string
        default: ''

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.recovery_run || github.ref }}
  cancel-in-progress: false

jobs:
  core:
    # Branch/PR pushes run ci-core separately; tag releases gate inside engine.
    if: github.event_name == 'workflow_dispatch' && inputs.recovery_run == ''
    uses: ./.github/workflows/ci-core.yml
    permissions:
      contents: read

  engine:
    if: github.event_name == 'push' && github.repository == 'sasy-labs/sasy' && !github.event.repository.private && startsWith(github.ref, 'refs/tags/sasy-v')
    uses: ./.github/workflows/engine-release.yml
    permissions:
      contents: read
      packages: write

  build:
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.recovery_run == '') && (needs.core.result == 'success' || needs.core.result == 'skipped') }}
    needs: core
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Check SDK identity and tag
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          project = tomllib.loads(pathlib.Path('sdk/python/pyproject.toml').read_text())['project']
          assert project['name'] == 'sasy'
          if os.environ['GITHUB_REF'].startswith('refs/tags/'):
              assert os.environ['GITHUB_REF_NAME'] == 'sasy-v' + project['version']
          PY
      - name: Build wheel and source distribution
        run: uv build --package sasy --out-dir artifacts
      - name: Check package metadata and independent installation
        run: |
          uvx --from twine twine check --strict artifacts/*
          uv venv "$RUNNER_TEMP/sdk-consumer"
          uv pip install --python "$RUNNER_TEMP/sdk-consumer/bin/python" artifacts/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sdk-consumer/bin/python" - <<'PY'
          import importlib.metadata, pathlib, sys, zipfile
          import sasy
          from sasy.auth import APIKeyAuthHook
          from sasy.proto import policy_engine_pb2
          assert pathlib.Path(sasy.__file__).is_relative_to(pathlib.Path(sys.prefix))
          for name in ('configure', 'session', 'check_tool_call'):
              assert callable(getattr(sasy, name)), name
          dist = importlib.metadata.distribution('sasy')
          files = [str(p) for p in dist.files]
          assert any(p.endswith('/LICENSE') for p in files)
          assert any(p.endswith('/NOTICE') for p in files)
          assert policy_engine_pb2.DESCRIPTOR.services_by_name
          assert callable(APIKeyAuthHook)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: sasy-python-package
          path: artifacts/*
          if-no-files-found: error

  publish:
    if: ${{ !cancelled() && github.event_name == 'push' && github.repository == 'sasy-labs/sasy' && !github.event.repository.private && startsWith(github.ref, 'refs/tags/sasy-v') && needs.engine.result == 'success' && needs.build.result == 'success' && needs.engine.outputs.digest != '' && github.ref_name == format('sasy-v{0}', needs.engine.outputs.version) }}
    needs: [engine, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sasy/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: sasy-python-package
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  recover_image:
    if: github.event_name == 'workflow_dispatch' && inputs.recovery_run != '' && github.ref == 'refs/heads/main' && github.repository_id == '1405994907' && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Require successful original release gates and retained artifacts
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN: ${{ inputs.recovery_run }}
        run: python scripts/prepare_release_recovery.py "$RELEASE_RUN"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.sha }}
          path: release-source
          persist-credentials: false
      - name: Validate original source versions
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
        run: python scripts/check_release_version.py "$RELEASE_TAG" --root release-source
      - uses: actions/download-artifact@v7
        with:
          pattern: engine-image-*
          path: image-refs
          merge-multiple: true
          run-id: ${{ inputs.recovery_run }}
          github-token: ${{ github.token }}
      - name: Verify the existing image anonymously with the corrected checker
        env:
          VERSION: ${{ steps.source.outputs.version }}
          DIGEST: ${{ steps.source.outputs.digest }}
        run: |
          python scripts/verify_public_image.py "ghcr.io/sasy-labs/sasy@$DIGEST" \
            --tagged-reference "ghcr.io/sasy-labs/sasy:$VERSION" \
            --amd64 "$(cat image-refs/sasy-linux-amd64.image)" \
            --arm64 "$(cat image-refs/sasy-linux-arm64.image)"

  publish_recovered:
    needs: recover_image
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sasy/
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: sasy-python-package
          path: dist
          run-id: ${{ inputs.recovery_run }}
          github-token: ${{ github.token }}
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
